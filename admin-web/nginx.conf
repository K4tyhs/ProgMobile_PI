# Servidor do painel em container (alternativa à Vercel). O HTTPS fica no proxy/balanceador
# na frente do container (a câmera do check-in só funciona em HTTPS).
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;

  # Arquivos com hash no nome podem ficar em cache por muito tempo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Rotas do React Router (/palestras/123, /alunos...) caem no index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
